<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Route Rehearsal</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673;
    --border: #d9dde3; --accent: #1a73e8; --accent-text: #fff; --warn: #b3261e;
    --turn: #e37400;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15181c; --panel: #1f2329; --text: #e6e9ed; --muted: #9aa3ae;
      --border: #343a42; --accent: #8ab4f8; --accent-text: #0b1a33; --warn: #f2b8b5;
      --turn: #ffb74d;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  header h1 { font-size: 16px; margin: 0 8px 0 0; white-space: nowrap; }
  input, select, button {
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
  }
  input[type=text], input[type=password] { flex: 1 1 180px; min-width: 0; }
  button { cursor: pointer; white-space: nowrap; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; display: flex; min-height: 0; }
  #left { flex: 1 1 65%; display: flex; flex-direction: column; min-width: 0; }
  #panoWrap { position: relative; flex: 1; min-height: 240px; background: #000; }
  #pano { position: absolute; inset: 0; }
  #hud {
    position: absolute; left: 12px; top: 12px; right: 12px; pointer-events: none;
    display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
  }
  .chip {
    background: rgba(0,0,0,.72); color: #fff; border-radius: 8px; padding: 6px 10px;
    max-width: 100%;
  }
  #nextTurn { font-size: 16px; font-weight: 600; }
  #nextTurn.soon { background: rgba(227,116,0,.92); }
  #thenTurn, #imgInfo { font-size: 12px; }
  #controls {
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  #scrub { flex: 1 1 200px; accent-color: var(--accent); }
  #progress { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 120px; }
  label.check { display: inline-flex; gap: 4px; align-items: center; color: var(--muted); }
  #map { flex: 0 0 35%; min-width: 0; border-left: 1px solid var(--border); }
  #status { padding: 6px 16px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--border); min-height: 30px; }
  #status.err { color: var(--warn); }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #left { flex: 1 1 auto; }
    #panoWrap { min-height: 45vh; }
    #map { flex: 0 0 32vh; border-left: 0; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<header>
  <h1>Route Rehearsal</h1>
  <input id="from" type="text" placeholder="From (address or lat,lng)">
  <input id="to" type="text" placeholder="To (address or lat,lng)">
  <input id="via" type="text" placeholder="Via (optional, separate with ;)">
  <select id="spacing" title="Distance between Street View steps">
    <option value="10">every 10 m</option>
    <option value="15" selected>every 15 m</option>
    <option value="25">every 25 m</option>
    <option value="40">every 40 m</option>
  </select>
  <button id="go" class="primary" disabled>Load route</button>
</header>

<main>
  <section id="left">
    <div id="panoWrap">
      <div id="pano"></div>
      <div id="hud">
        <div id="nextTurn" class="chip" hidden></div>
        <div id="thenTurn" class="chip" hidden></div>
        <div id="imgInfo" class="chip" hidden></div>
      </div>
    </div>
    <div id="controls">
      <button id="restart" title="Back to start" disabled>⏮</button>
      <button id="back" title="Step back (←)" disabled>◀</button>
      <button id="play" class="primary" title="Play / pause (space)" disabled>▶ Play</button>
      <button id="fwd" title="Step forward (→)" disabled>▶︎|</button>
      <input id="scrub" type="range" min="0" max="0" value="0" disabled>
      <span id="progress">–</span>
      <select id="speed" title="Playback speed">
        <option value="0.5">0.5 steps/s</option>
        <option value="1">1 step/s</option>
        <option value="2" selected>2 steps/s</option>
        <option value="3">3 steps/s</option>
        <option value="5">5 steps/s</option>
      </select>
      <select id="units">
        <option value="km">km</option>
        <option value="mi">mi</option>
      </select>
      <label class="check"><input id="slowTurns" type="checkbox" checked> slow near turns</label>
    </div>
  </section>
  <aside id="map"></aside>
</main>
<div id="status">Loading…</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } },
  };

  const LOOK_AHEAD_M = 25;     // camera aims at the route this far ahead
  const PANO_RADIUS_M = 25;    // search radius when (re)finding a panorama for a point
  const OFF_ROUTE_M = 15;      // panoramas farther than this from the route line are rejected
  const REANCHOR_M = 30;       // if road-following ends up farther than this from the target, search again
  const MAX_HOPS = 6;          // panorama-to-panorama hops per step
  const TURN_ZONE_M = 80;      // "slow near turns" kicks in within this distance

  let G = null, map, pano, svService, routeLine, carMarker;
  let samples = [];            // {lat, lng, d, heading}
  let steps = [];              // {d, text}
  let totalLen = 0;
  let idx = 0, playing = false, timer = null, showToken = 0, lastPanoId = null;
  let byIdCache = new Map();   // pano id -> Promise<data|null>
  let anchorCache = new Map(); // sample index -> Promise<data|null>
  let curData = null, curIdx = -1; // panorama currently shown and the step it belongs to

  // ---------- helpers ----------
  function setStatus(msg, isErr) {
    const el = $('status');
    el.textContent = msg;
    el.classList.toggle('err', !!isErr);
  }
  function toLL(p) {
    if (!p) return null;
    if (p.latLng) return toLL(p.latLng);
    if (p.location) return toLL(p.location);
    const lat = typeof p.lat === 'function' ? p.lat() : p.lat;
    const lng = typeof p.lng === 'function' ? p.lng() : p.lng;
    return (typeof lat === 'number' && typeof lng === 'number') ? { lat, lng } : null;
  }
  function parseLoc(s) {
    const m = s.trim().match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
    return m ? { lat: +m[1], lng: +m[2] } : s.trim();
  }
  function stripHtml(html) {
    const d = document.createElement('div');
    d.innerHTML = html || '';
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }
  const dist = (a, b) => G.geometry.spherical.computeDistanceBetween(a, b);
  const heading = (a, b) => G.geometry.spherical.computeHeading(a, b);
  function fmtDist(m) {
    if ($('units').value === 'mi') {
      const mi = m / 1609.344;
      return mi < 0.1 ? Math.round(m * 3.28084 / 10) * 10 + ' ft' : mi.toFixed(mi < 10 ? 1 : 0) + ' mi';
    }
    return m < 1000 ? Math.round(m / 5) * 5 + ' m' : (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' km';
  }

  // ---------- load Google Maps ----------
  // Public browser key: restricted to Maps JavaScript + Routes APIs and to chasezhang.me.
  const GMAPS_KEY = 'AIzaSyDs6S7Q_75OiUWBrmJe9Ih_ycwV8ZXkwHk';
  function loadMaps(key) {
    if (window.google && window.google.maps) return Promise.resolve();
    return new Promise((resolve, reject) => {
      window.__rrInit = resolve;
      window.gm_authFailure = () => {
        setStatus('Google Maps is unavailable right now (API key rejected or over quota). Please try again later.', true);
      };
      const s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) +
              '&v=weekly&libraries=geometry&loading=async&callback=__rrInit';
      s.async = true;
      s.onerror = () => reject(new Error('Could not load the Google Maps script (network blocked?).'));
      document.head.appendChild(s);
    });
  }

  async function start() {
    const key = GMAPS_KEY;
    setStatus('Loading Google Maps…');
    try { await loadMaps(key); } catch (e) { setStatus(e.message, true); return; }
    G = google.maps;
    map = new G.Map($('map'), {
      center: { lat: 37.7749, lng: -122.4194 }, zoom: 12,
      streetViewControl: false, mapTypeControl: false, fullscreenControl: false,
      clickableIcons: false,
    });
    pano = new G.StreetViewPanorama($('pano'), {
      addressControl: false, linksControl: false, panControl: false,
      zoomControl: false, motionTracking: false, motionTrackingControl: false,
      enableCloseButton: false, clickToGo: false, showRoadLabels: true,
      fullscreenControl: true, visible: true,
    });
    svService = new G.StreetViewService();
    map.addListener('click', (e) => jumpToNearest(e.latLng));
    $('go').disabled = false;
    setStatus('Ready. Enter a start and destination, then Load route.');

    const p = new URLSearchParams(location.search);
    if (p.get('from') && p.get('to')) loadRoute();
  }

  // ---------- routing ----------
  async function computeRoute(from, to, via) {
    const errors = [];
    // 1) New Routes library (Route.computeRoutes)
    try {
      const lib = await G.importLibrary('routes');
      if (lib.Route && lib.Route.computeRoutes) {
        const req = { origin: from, destination: to, travelMode: 'DRIVING', fields: ['path', 'legs'] };
        if (via.length) req.intermediates = via.map((v) => ({ location: v }));
        const { routes } = await lib.Route.computeRoutes(req);
        if (!routes || !routes.length) throw new Error('No route found');
        const r = routes[0];
        const path = (r.path || []).map(toLL).filter(Boolean);
        const st = [];
        for (const leg of r.legs || []) {
          for (const s of leg.steps || []) {
            const loc = toLL(s.startLocation) || (s.path && toLL(s.path[0]));
            const text = s.instructions || (s.navigationInstruction && s.navigationInstruction.instructions) || '';
            if (loc && text) st.push({ loc, text: stripHtml(text) });
          }
        }
        if (path.length > 1) return { path, steps: st };
        throw new Error('Route had no path');
      }
    } catch (e) { errors.push('Routes: ' + (e.message || e)); }

    // 2) Legacy DirectionsService
    try {
      const ds = new G.DirectionsService();
      const res = await ds.route({
        origin: from, destination: to, travelMode: G.TravelMode.DRIVING,
        waypoints: via.map((v) => ({ location: v, stopover: false })),
      });
      const r = res.routes[0];
      const path = [], st = [];
      for (const leg of r.legs) {
        for (const s of leg.steps) {
          for (const p of s.path) path.push(toLL(p));
          st.push({ loc: toLL(s.start_location), text: stripHtml(s.instructions) });
        }
      }
      return { path: path.length > 1 ? path : r.overview_path.map(toLL), steps: st };
    } catch (e) { errors.push('Directions: ' + (e.message || e.code || e)); }

    throw new Error('Could not get a route. ' + errors.join(' | '));
  }

  function resample(path, spacing) {
    const out = [{ lat: path[0].lat, lng: path[0].lng, d: 0 }];
    let cum = 0, carry = 0;
    for (let i = 0; i < path.length - 1; i++) {
      const a = new G.LatLng(path[i]), b = new G.LatLng(path[i + 1]);
      const seg = dist(a, b);
      if (seg === 0) continue;
      let pos = spacing - carry;
      while (pos <= seg) {
        const p = G.geometry.spherical.interpolate(a, b, pos / seg);
        out.push({ lat: p.lat(), lng: p.lng(), d: cum + pos });
        pos += spacing;
      }
      carry = seg - (pos - spacing);
      cum += seg;
    }
    const last = path[path.length - 1];
    if (cum - out[out.length - 1].d > spacing * 0.3) out.push({ lat: last.lat, lng: last.lng, d: cum });
    // route-direction heading for each sample (fallback when the panorama sits on the point)
    for (let i = 0; i < out.length; i++) {
      const j = aheadIndex(out, i, LOOK_AHEAD_M);
      const a = out[i], b = out[j === i ? Math.max(0, i - 1) : j];
      out[i].heading = j === i && i > 0 ? out[i - 1].heading : heading(new G.LatLng(a), new G.LatLng(b));
    }
    return { samples: out, total: cum };
  }

  function aheadIndex(arr, i, meters) {
    let j = i;
    while (j < arr.length - 1 && arr[j].d < arr[i].d + meters) j++;
    return j;
  }

  function mapSteps(rawSteps) {
    const out = [];
    let from = 0;
    for (let k = 0; k < rawSteps.length; k++) {
      const ll = new G.LatLng(rawSteps[k].loc);
      let best = from, bestD = Infinity;
      // search forward, but stop scanning once we're well past a good match
      for (let i = from; i < samples.length; i++) {
        const dd = dist(ll, new G.LatLng(samples[i]));
        if (dd < bestD) { bestD = dd; best = i; }
        if (bestD < 15 && dd > 300) break;
      }
      from = best;
      out.push({ d: samples[best].d, text: rawSteps[k].text });
    }
    return out;
  }

  async function loadRoute() {
    const fromS = $('from').value.trim(), toS = $('to').value.trim();
    if (!fromS || !toS) { setStatus('Enter both a start and a destination.', true); return; }
    const via = $('via').value.split(';').map((s) => s.trim()).filter(Boolean).map(parseLoc);
    pause();
    setStatus('Finding route…');
    $('go').disabled = true;
    try {
      const r = await computeRoute(parseLoc(fromS), parseLoc(toS), via);
      const spacing = +$('spacing').value;
      const rs = resample(r.path, spacing);
      samples = rs.samples; totalLen = rs.total;
      steps = mapSteps(r.steps);
      byIdCache = new Map(); anchorCache = new Map(); lastPanoId = null; curData = null; curIdx = -1;

      if (routeLine) routeLine.setMap(null);
      routeLine = new G.Polyline({ path: r.path, map, strokeColor: '#1a73e8', strokeOpacity: 0.85, strokeWeight: 5 });
      const b = new G.LatLngBounds();
      r.path.forEach((p) => b.extend(p));
      map.fitBounds(b, 30);
      if (!carMarker) {
        carMarker = new G.Marker({
          map, zIndex: 10,
          icon: { path: G.SymbolPath.FORWARD_CLOSED_ARROW, scale: 6, fillColor: '#e37400', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2, rotation: 0 },
        });
      }

      const scrub = $('scrub');
      scrub.max = samples.length - 1; scrub.value = 0;
      ['restart', 'back', 'play', 'fwd', 'scrub'].forEach((id) => { $(id).disabled = false; });

      const q = new URLSearchParams(location.search);
      q.set('from', fromS); q.set('to', toS);
      if ($('via').value.trim()) q.set('via', $('via').value.trim()); else q.delete('via');
      history.replaceState(null, '', location.pathname + '?' + q.toString());

      setStatus(`Route: ${fmtDist(totalLen)}, ${samples.length} steps, ${steps.length} instructions. Press Play (space) or use ← →. Click the map to jump.`);
      await show(0);
    } catch (e) {
      setStatus(e.message || String(e), true);
    } finally {
      $('go').disabled = false;
    }
  }

  // ---------- street view ----------
  // Strategy: once we are on a road panorama, move by following its links (the arrows you'd
  // click in Street View), always to the linked panorama closest to the next route point.
  // Road panoramas link along the road, so this does not drop into subway stations, garages or
  // user photo spheres the way "nearest panorama" can. We only search by location to get started,
  // after a jump, or when the road links run out.
  function cachePano(data) {
    if (data && data.location && !byIdCache.has(data.location.pano)) byIdCache.set(data.location.pano, Promise.resolve(data));
    return data;
  }
  function getById(id) {
    if (!byIdCache.has(id)) {
      byIdCache.set(id, svService.getPanorama({ pano: id }).then((r) => r.data).catch(() => null));
    }
    return byIdCache.get(id);
  }
  function onRoute(latLng) {
    return G.geometry.poly.isLocationOnEdge(latLng, routeLine, OFF_ROUTE_M / 111320);
  }
  // A usable road panorama: Google's own imagery (not a user upload), connected to neighbours, on the route.
  function isRoadPano(d) {
    return !!(d && d.location && d.location.latLng &&
      /google/i.test(d.copyright || '') &&
      (d.links || []).some((l) => l && l.pano) &&
      onRoute(d.location.latLng));
  }
  function findAnchor(i) {
    if (anchorCache.has(i)) return anchorCache.get(i);
    const s = samples[i];
    const p = svService.getPanorama({
      location: { lat: s.lat, lng: s.lng }, radius: PANO_RADIUS_M,
      source: G.StreetViewSource.OUTDOOR, preference: G.StreetViewPreference.NEAREST,
    }).then((r) => cachePano(r.data)).then((d) => (isRoadPano(d) ? d : null)).catch(() => null);
    anchorCache.set(i, p);
    return p;
  }
  async function walkToward(start, target) {
    let cur = start;
    for (let hop = 0; hop < MAX_HOPS; hop++) {
      const dCur = dist(cur.location.latLng, target);
      if (dCur < 4) break;
      const ids = (cur.links || []).map((l) => l && l.pano).filter(Boolean);
      const cands = await Promise.all(ids.map(getById));
      let best = null, bestD = dCur - 0.5;
      for (const c of cands) {
        if (!isRoadPano(c)) continue;
        const d = dist(c.location.latLng, target);
        if (d < bestD) { best = c; bestD = d; }
      }
      if (!best) break;
      cur = best;
    }
    return cur;
  }
  async function resolvePano(i) {
    const target = new G.LatLng(samples[i]);
    if (curData && Math.abs(i - curIdx) <= 4) {
      const walked = await walkToward(curData, target);
      if (dist(walked.location.latLng, target) <= REANCHOR_M) return walked;
    }
    const anchor = await findAnchor(i);
    return anchor || (curData && dist(curData.location.latLng, target) <= REANCHOR_M ? curData : null);
  }

  function updateHud(i) {
    const d = samples[i].d;
    const nextIdx = steps.findIndex((s) => s.d > d + 2);
    const nt = $('nextTurn'), tt = $('thenTurn');
    if (nextIdx >= 0) {
      const away = steps[nextIdx].d - d;
      nt.textContent = `In ${fmtDist(away)}: ${steps[nextIdx].text}`;
      nt.classList.toggle('soon', away <= TURN_ZONE_M * 2);
      nt.hidden = false;
      const then = steps[nextIdx + 1];
      tt.hidden = !then;
      if (then) tt.textContent = `Then: ${then.text}`;
    } else {
      nt.textContent = `Arriving in ${fmtDist(totalLen - d)}`;
      nt.classList.remove('soon');
      nt.hidden = false; tt.hidden = true;
    }
    $('progress').textContent = `${fmtDist(d)} / ${fmtDist(totalLen)}`;
    $('scrub').value = i;
  }

  function nearTurn(i) {
    const d = samples[i].d;
    return steps.some((s) => s.d > 0 && Math.abs(s.d - d) <= TURN_ZONE_M);
  }

  // Shows sample i. Resolves to true if the panorama changed.
  async function show(i) {
    if (!samples.length) return false;
    i = Math.max(0, Math.min(samples.length - 1, i));
    idx = i;
    const tok = ++showToken;
    const s = samples[i];
    updateHud(i);
    const icon = carMarker.getIcon();
    icon.rotation = s.heading;
    carMarker.setIcon(icon);
    carMarker.setPosition(s);
    const bounds = map.getBounds();
    if (bounds && !bounds.contains(s)) map.panTo(s);

    const data = await resolvePano(i);
    if (tok !== showToken) return false;
    if (data) {
      curData = data; curIdx = i;
      for (const l of data.links || []) if (l && l.pano) getById(l.pano); // prefetch the next hops
    }

    const info = $('imgInfo');
    info.hidden = false;
    if (!data) { info.textContent = 'No road Street View near this point'; return false; }
    info.textContent = 'Imagery: ' + (data.imageDate || 'date unknown') +
      (data.location && data.location.description ? ' · ' + data.location.description : '');

    const panoLL = data.location.latLng;
    const ahead = samples[aheadIndex(samples, i, LOOK_AHEAD_M)];
    const aheadLL = new G.LatLng(ahead);
    const h = dist(panoLL, aheadLL) < 8 ? s.heading : heading(panoLL, aheadLL);
    const changed = data.location.pano !== lastPanoId;
    if (changed) { pano.setPano(data.location.pano); lastPanoId = data.location.pano; }
    pano.setPov({ heading: h, pitch: -2 });
    pano.setZoom(0);
    return changed;
  }

  function jumpToNearest(latLng) {
    if (!samples.length) return;
    let best = 0, bestD = Infinity;
    for (let i = 0; i < samples.length; i++) {
      const d = dist(latLng, new G.LatLng(samples[i]));
      if (d < bestD) { bestD = d; best = i; }
    }
    if (bestD < 200) show(best); else setStatus('Click closer to the route to jump there.');
  }

  // ---------- playback ----------
  function play() {
    if (!samples.length) return;
    if (idx >= samples.length - 1) idx = 0;
    playing = true;
    $('play').textContent = '⏸ Pause';
    tick();
  }
  function pause() {
    playing = false;
    clearTimeout(timer);
    $('play').textContent = '▶ Play';
  }
  async function tick() {
    if (!playing) return;
    if (idx >= samples.length - 1) { pause(); setStatus('Arrived. Press Play to run it again.'); return; }
    const changed = await show(idx + 1);
    if (!playing) return;
    let delay = 1000 / +$('speed').value;
    if ($('slowTurns').checked && nearTurn(idx)) delay *= 2.5;
    if (!changed) delay = Math.min(delay, 150); // same panorama: don't sit still
    timer = setTimeout(tick, delay);
  }

  // ---------- wiring ----------
  $('go').addEventListener('click', loadRoute);
  ['from', 'to', 'via'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter' && G) loadRoute(); }));
  $('play').addEventListener('click', () => (playing ? pause() : play()));
  $('restart').addEventListener('click', () => { pause(); show(0); });
  $('back').addEventListener('click', () => { pause(); show(idx - 1); });
  $('fwd').addEventListener('click', () => { pause(); show(idx + 1); });
  $('scrub').addEventListener('input', (e) => show(+e.target.value));
  $('units').addEventListener('change', () => { if (samples.length) updateHud(idx); });
  document.addEventListener('keydown', (e) => {
    if (!samples.length || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName) && e.target.type !== 'range') return;
    if (e.key === ' ') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); pause(); show(idx + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); pause(); show(idx - 1); }
  });

  const params = new URLSearchParams(location.search);
  $('from').value = params.get('from') || '';
  $('to').value = params.get('to') || '';
  $('via').value = params.get('via') || '';
  try { const u = store.get('rr_units'); if (u) $('units').value = u; } catch (e) { /* ignore */ }
  $('units').addEventListener('change', () => store.set('rr_units', $('units').value));
  start();
})();
</script>
</body>
</html>
